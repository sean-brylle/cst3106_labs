<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
        <link rel="stylesheet" href="style.css">
        <script src="code.js"></script>
        <title>Yahtzee Game</title>
    </head>
    <body>
        <main>
            <div class="header-container">
                <p class="header-text">Yahtzee</p>
            </div>
            <div class="body-container"> 
                <div>
                    <div class="container" id = "main-container">
                        <div class="row">
                        <div class="col-3">
                           <form>
                           <fieldset disabled>
                               <h6> Score Card </h6>
                               <hr>
                               <p> Lower Section  - - </p>
                               <div class="form-group">
                               <label for="disabledTextInput">One's</label>
                               <input type="text" id="disabledTextInput1" class="form-control" placeholder="0">
                               </div>
                               <div class="form-group">
                               <label for="disabledTextInput">Two's</label>
                               <input type="text" id="disabledTextInput" class="form-control" placeholder="0">
                               </div>
                               <div class="form-group">
                               <label for="disabledTextInput">Three's</label>
                               <input type="text" id="disabledTextInput" class="form-control" placeholder="0">
                               </div>
                               <div class="form-group">
                               <label for="disabledTextInput">Four's</label>
                               <input type="text" id="disabledTextInput" class="form-control" placeholder="0">
                               </div>
                               <div class="form-group">
                               <label for="disabledTextInput">Five's</label>
                               <input type="text" id="disabledTextInput" class="form-control" placeholder="0">
                               </div>
                               <div class="form-group">
                               <label for="disabledTextInput">Six's</label>
                               <input type="text" id="disabledTextInput" class="form-control" placeholder="0">
                               </div>
                               <hr>
                               <p> Upper Section - -  </p>
                               <div class="form-group">
                               <label for="disabledTextInput">3 of a Kind</label>
                               <input type="text" id="disabledTextInput" class="form-control" placeholder="">
                               </div>
                               <div class="form-group">
                               <label for="disabledTextInput">4 of a Kind</label>
                               <input type="text" id="disabledTextInput" class="form-control" placeholder="0">
                               </div>
                               <div class="form-group">
                               <label for="disabledTextInput">Straight</label>
                               <input type="text" id="disabledTextInput" class="form-control" placeholder="30 pts">
                               </div>
                               <div class="form-group">
                               <label for="disabledTextInput">Full House</label>
                               <input type="text" id="disabledTextInput" class="form-control" placeholder="25 pts">
                               </div>
                               <div class="form-group">
                               <label for="disabledTextInput">Yahtzee</label>
                               <input type="text" id="disabledTextInput" class="form-control" placeholder="50 pts">
                               </div>
                               <div class="form-group">
                               <label for="disabledTextInput">Chance</label>
                               <input type="text" id="disabledTextInput" class="form-control" placeholder="0">
                               </div>
                           </fieldset>
                           </form>
                       </div>
                       </div>
                </div>
                <div>

                </div>
            </div>
        </main>
        <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js" integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49" crossorigin="anonymous"></script>
        <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js" integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy" crossorigin="anonymous"></script>
    </body>
</html>
