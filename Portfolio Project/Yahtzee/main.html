<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Yahtzee Game</title>
    <script src="Main.js"></script>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
      integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
      crossorigin="anonymous"
    />
  </head>

  <body class="bg-main">
    <header class="m-3 shadow-main">
      <h1 class="d-flex justify-content-center bg-secound text-white pt-4 pb-4">
        Yahtzee
      </h1>
    </header>

    <!-- pannel -->

    <div class="d-flex flex-row bg-main m-3 shadow-main">
      <section>
        <div class="score-card bg-secound text-white m-3 shadow-main">
          <h1>Score Card</h1>
          <div>
            <h4 class="section-title pb-3">Upper Section</h4>
            <div class="score-row d-flex flex-row justify-content-between pb-2">
              <div class="score-label">Ones</div>
              <input
                type="text"
                id="disabledTextInput"
                class="score-input"
                onclick="onClickUpper(event, '1')"
              />
            </div>
          </div>
          <div class="score-row d-flex flex-row justify-content-between pb-2">
            <div class="score-label">Twos</div>
            <input
              type="text"
              id="disabledTextInput"
              class="score-input"
              onclick="onClickUpper(event, '2')"
            />
          </div>
          <div class="score-row d-flex flex-row justify-content-between pb-2">
            <div class="score-label">Threes</div>
            <input
              type="text"
              id="disabledTextInput"
              class="score-input"
              onclick="onClickUpper(event, '3')"
            />
          </div>
          <div class="score-row d-flex flex-row justify-content-between pb-2">
            <div class="score-label">Fours</div>
            <input
              type="text"
              id="disabledTextInput"
              class="score-input"
              onclick="onClickUpper(event, '4')"
            />
          </div>
          <div class="score-row d-flex flex-row justify-content-between pb-2">
            <div class="score-label">Fives</div>
            <input
              type="text"
              id="disabledTextInput"
              class="score-input"
              onclick="onClickUpper(event, '5')"
            />
          </div>
          <div class="score-row d-flex flex-row justify-content-between pb-2">
            <div class="score-label">Sixes</div>
            <input
              type="text"
              id="disabledTextInput"
              class="score-input"
              onclick="onClickUpper(event, '6')"
            />
          </div>
          <div class="score-row d-flex flex-row justify-content-between pb-2">
            <div class="score-label">Bonus</div>
            <input type="text" id="disabledTextInput" class="score-input" />
          </div>

          <h4 class="section-title pb-4 pt-5">Lower Section</h4>
          <div class="score-row d-flex flex-row justify-content-between pb-2">
            <div class="score-label">Three-of-a-kind</div>
            <input
              type="text"
              id="disabledTextInput"
              class="score-input"
              onclick="threeOfAKindScore(event)"
            />
          </div>
          <div class="score-row d-flex flex-row justify-content-between pb-2">
            <div class="score-label">Four-of-a-kind</div>
            <input
              type="text"
              id="disabledTextInput"
              class="score-input"
              onclick="fourOfAKindScore(event)"
            />
          </div>
          <div class="score-row d-flex flex-row justify-content-between pb-2">
            <div class="score-label">Full House</div>
            <input
              type="text"
              id="disabledTextInput"
              class="score-input"
              onclick="fullHouseScore(event)"
            />
          </div>
          <div class="score-row d-flex flex-row justify-content-between pb-2">
            <div class="score-label">Small Straight</div>
            <input
              type="text"
              id="disabledTextInput"
              class="score-input"
              onclick="yahtzeeScore(event)"
            />
          </div>
          <div class="score-row d-flex flex-row justify-content-between pb-2">
            <div class="score-label">Large Straight</div>
            <input
              type="text"
              id="disabledTextInput"
              class="score-input"
              onclick="largeStraightScore(event)"
            />
          </div>
          <div class="score-row d-flex flex-row justify-content-between pb-2">
            <div class="score-label">Yahtzee</div>
            <input
              type="text"
              id="disabledTextInput"
              class="score-input"
              onclick="smallStraightScore(event)"
            />
          </div>
          <div class="score-row d-flex flex-row justify-content-between">
            <div class="score-label">Chance</div>
            <input type="text" id="disabledTextInput" class="score-input" />
          </div>

          <div class="d-flex justify-content-center mt-4">
            <div
              class="points-card board-r border text-center d-flex justify-content-between"
            >
              <h4 class="label">Points</h4>
              <div class="score" id="totalPoints">0</div>
            </div>
          </div>
        </div>
      </section>

      <!-- main -->

      <section>
        <div class="section-one">
          <div class="round-box text-white border mb-4">
            <div class="d-flex flex-column align-items-center">
              <h2 class="py-2">Round</h2>
              <div>
                <p class="round-text border bg-thrid text-main">1</p>
              </div>
            </div>
            <div class="d-flex flex-column text-right pr-3 py-2">
              <p>Rounds Remaining</p>
              <p class="text-main">12</p>
            </div>
          </div>

          <div class="text-white d-flex flex-column align-items-center">
            <button
              class="btn-main text-center my-4 text-white"
              onclick="rollDice()"
            >
              ROLL DICE
            </button>
            <button class="btn-main text-center text-white">RE-ROLL</button>
            <button class="btn-main text-center my-4 text-white">
              Start a New Game
            </button>
          </div>
        </div>
      </section>
      <section>
        <div class="section-one text-white">
          <div class="border text-center board-r p-3">
            <p class="text-main">
              Hold the dice you want to keep.<br />You have
              <span id="rollsLeft">3</span> rolls left.
            </p>
          </div>

          <div class="py-5 gap-0 column-gap-3">
            <img
              class="dice mr-3"
              src="empty.png"
              alt="Dice showing 1"
              id="dice1"
              onclick="holdDice('dice1')"
            />
            <img
              class="dice mr-3"
              src="empty.png"
              alt="Dice showing 2"
              id="dice2"
              onclick="holdDice('dice2')"
            />
            <img
              class="dice mr-3"
              src="empty.png"
              alt="Dice showing 3"
              id="dice3"
              onclick="holdDice('dice3')"
            />
            <img
              class="dice mr-3"
              src="empty.png"
              alt="Dice showing 4"
              id="dice4"
              onclick="holdDice('dice4')"
            />
            <img
              class="dice mr-3"
              src="empty.png"
              alt="Dice showing 5"
              id="dice5"
              onclick="holdDice('dice5')"
            />
          </div>
        </div>
      </section>
    </div>
  </body>
</html>
