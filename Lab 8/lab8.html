<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
      integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
      crossorigin="anonymous"
    />
    <title>Dice Roller</title>
    <style>
      /* Custom styles for die and dots */
      .die {
        width: 150px;
        height: 150px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 5px solid white;
        background: linear-gradient(145deg, #dddbdd, #fff);
        position: relative;
        transition: transform 0.3s;
        border-radius: 20px;
      }

      .dot {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background-color: black;
        position: absolute;
      }
    </style>
  </head>
  <body
    class="bg-dark mt-5 pt-5 d-flex justify-content-center align-items-center vh-100"
  >
    <div class="text-center">
      <div
        id="diceContainer"
        class="d-flex gap-3 justify-content-center align-items-center mb-3"
      >
        <div class="die" data-value="1">
          <div class="dot" style="top: 25%; left: 25%"></div>
          <div class="dot" style="top: 25%; right: 25%"></div>
          <div
            class="dot"
            style="top: 50%; left: 25%; transform: translate(0, -50%)"
          ></div>
          <div
            class="dot"
            style="top: 50%; right: 25%; transform: translate(0, -50%)"
          ></div>
          <div class="dot" style="bottom: 25%; left: 25%"></div>
          <div class="dot" style="bottom: 25%; right: 25%"></div>
        </div>
      </div>

      <button id="rollDiceButton" class="btn btn-default roll">
        Roll Dice
      </button>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <script>
      $(document).ready(function () {
        let currentRotation = 0;

        $("#rollDiceButton").on("click", function () {
          rollDie();
        });

        function rollDie() {
          let diceValue = Math.floor(Math.random() * 6) + 1;

          // Calculate rotation to ensure it ends up aligned (multiple of 180)
          let rotationToComplete = 180 - (currentRotation % 180);
          currentRotation += 180 + rotationToComplete;

          $(".die").attr("data-value", diceValue);

          $(".die")
            .css("transition", "transform 1s ease")
            .css("transform", `rotate(${currentRotation}deg)`);

          $(".dot").remove();

          switch (diceValue) {
            case 1:
              $(".die").append(
                '<div class="dot" style="top: 50%; left: 50%; transform: translate(-50%, -50%);"></div>'
              );
              break;
            case 2:
              $(".die").append(
                '<div class="dot" style="top: 25%; left: 25%;"></div>'
              );
              $(".die").append(
                '<div class="dot" style="bottom: 25%; right: 25%;"></div>'
              );
              break;
            case 3:
              $(".die").append(
                '<div class="dot" style="top: 25%; left: 25%;"></div>'
              );
              $(".die").append(
                '<div class="dot" style="top: 50%; left: 50%; transform: translate(-50%, -50%);"></div>'
              );
              $(".die").append(
                '<div class="dot" style="bottom: 25%; right: 25%;"></div>'
              );
              break;
            case 4:
              $(".die").append(
                '<div class="dot" style="top: 25%; left: 25%;"></div>'
              );
              $(".die").append(
                '<div class="dot" style="top: 25%; right: 25%;"></div>'
              );
              $(".die").append(
                '<div class="dot" style="bottom: 25%; left: 25%;"></div>'
              );
              $(".die").append(
                '<div class="dot" style="bottom: 25%; right: 25%;"></div>'
              );
              break;
            case 5:
              $(".die").append(
                '<div class="dot" style="top: 25%; left: 25%;"></div>'
              );
              $(".die").append(
                '<div class="dot" style="top: 25%; right: 25%;"></div>'
              );
              $(".die").append(
                '<div class="dot" style="top: 50%; left: 50%; transform: translate(-50%, -50%);"></div>'
              );
              $(".die").append(
                '<div class="dot" style="bottom: 25%; left: 25%;"></div>'
              );
              $(".die").append(
                '<div class="dot" style="bottom: 25%; right: 25%;"></div>'
              );
              break;
            case 6:
              $(".die").append(
                '<div class="dot" style="top: 25%; left: 25%;"></div>'
              );
              $(".die").append(
                '<div class="dot" style="top: 25%; right: 25%;"></div>'
              );
              $(".die").append(
                '<div class="dot" style="top: 50%; left: 25%; transform: translate(0, -50%);"></div>'
              );
              $(".die").append(
                '<div class="dot" style="top: 50%; right: 25%; transform: translate(0, -50%);"></div>'
              );
              $(".die").append(
                '<div class="dot" style="bottom: 25%; left: 25%;"></div>'
              );
              $(".die").append(
                '<div class="dot" style="bottom: 25%; right: 25%;"></div>'
              );
              break;
          }
        }
      });
    </script>
  </body>
</html>
