<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
      integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
      crossorigin="anonymous"
    />
    <title>Dice Roller</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <style>
      .die {
        width: 150px;
        height: 150px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 5px solid white;
        background: linear-gradient(145deg, #dddbdd, #fff);
        position: relative;
        transition: transform 0.3s;
        border-radius: 20px;
      }

      .dot {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background-color: black;
        position: absolute;
      }
    </style>
  </head>
  <body
    class="bg-dark mt-5 pt-5 d-flex justify-content-center align-items-center vh-100"
  >
    <div class="text-center">
      <div
        id="diceContainer"
        class="d-flex gap-3 justify-content-center align-items-center mb-3"
      >
        <div class="die" data-value="1">
          <div class="dot" style="top: 25%; left: 25%"></div>
          <div class="dot" style="top: 25%; right: 25%"></div>
          <div
            class="dot"
            style="top: 50%; left: 25%; transform: translate(0, -50%)"
          ></div>
          <div
            class="dot"
            style="top: 50%; right: 25%; transform: translate(0, -50%)"
          ></div>
          <div class="dot" style="bottom: 25%; left: 25%"></div>
          <div class="dot" style="bottom: 25%; right: 25%"></div>
        </div>
      </div>

      <button id="rollDiceButton" class="btn btn-default roll">
        Roll Dice
      </button>
    </div>

    <script>
      $(document).ready(function () {
        $("#rollDiceButton").on("click", function () {
          const $button = $(this);
          const $dice = $(".die");

          $button.prop("disabled", true);

          rollDie($dice, $button);
        });

        function rollDie($dice, $button) {
          let animationCount = 0;
          const totalAnimations = 10;
          const animationInterval = 250;

          // Set initial animation colors
          $dice.css({
            background: "linear-gradient(145deg, #ff4d4d, #b30000)",
            transition: "background-color 0.3s ease",
          });

          $dice.each(function () {
            $(this).empty();
          });

          const rollInterval = setInterval(() => {
            if (animationCount < totalAnimations) {
              $dice.each(function () {
                const randomValue = Math.floor(Math.random() * 6) + 1;
                $(this).empty();
                addDots(randomValue, $(this), true);
              });
              animationCount++;
            } else {
              clearInterval(rollInterval);

              $dice.css({
                background: "linear-gradient(145deg, #dddbdd, #fff)",
                transition: "background-color 0.3s ease",
              });

              $dice.each(function () {
                const finalValue = Math.floor(Math.random() * 6) + 1;
                $(this).empty();
                addDots(finalValue, $(this), false);
              });

              $button.prop("disabled", false);
            }
          }, animationInterval);
        }

        function addDots(diceValue, $die, isAnimating) {
          const dotConfigs = {
            1: [
              {
                top: "50%",
                left: "50%",
                transform: "translate(-50%, -50%)",
              },
            ],
            2: [
              { top: "25%", left: "25%" },
              { bottom: "25%", right: "25%" },
            ],
            3: [
              { top: "25%", left: "25%" },
              { top: "50%", left: "50%", transform: "translate(-50%, -50%)" },
              { bottom: "25%", right: "25%" },
            ],
            4: [
              { top: "25%", left: "25%" },
              { top: "25%", right: "25%" },
              { bottom: "25%", left: "25%" },
              { bottom: "25%", right: "25%" },
            ],
            5: [
              { top: "25%", left: "25%" },
              { top: "25%", right: "25%" },
              { top: "50%", left: "50%", transform: "translate(-50%, -50%)" },
              { bottom: "25%", left: "25%" },
              { bottom: "25%", right: "25%" },
            ],
            6: [
              { top: "25%", left: "25%" },
              { top: "25%", right: "25%" },
              { top: "50%", left: "25%", transform: "translate(0, -50%)" },
              { top: "50%", right: "25%", transform: "translate(0, -50%)" },
              { bottom: "25%", left: "25%" },
              { bottom: "25%", right: "25%" },
            ],
          };

          const dots = dotConfigs[diceValue];
          dots.forEach((dotPosition) => {
            const $dot = $("<div>").addClass("dot");

            $dot.css({
              position: "absolute",
              width: "20px",
              height: "20px",
              backgroundColor: isAnimating ? "white" : "black",
              borderRadius: "50%",
              transition: "background-color 0.3s ease",
              ...dotPosition,
            });

            $die.append($dot);
          });
        }
      });
    </script>
  </body>
</html>
