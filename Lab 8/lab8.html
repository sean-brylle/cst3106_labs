<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
      integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
      crossorigin="anonymous"
    />
    <title>Dice Roller</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <style>
      /* Custom styles for die and dots */
      .die {
        width: 150px;
        height: 150px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 5px solid white;
        background: linear-gradient(145deg, #dddbdd, #fff);
        position: relative;
        transition: transform 0.3s;
        border-radius: 20px;
      }

      .dot {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background-color: black;
        position: absolute;
      }
    </style>
  </head>
  <body
    class="bg-dark mt-5 pt-5 d-flex justify-content-center align-items-center vh-100"
  >
    <div class="text-center">
      <div
        id="diceContainer"
        class="d-flex gap-3 justify-content-center align-items-center mb-3"
      >
        <div class="die" data-value="1">
          <div class="dot" style="top: 25%; left: 25%"></div>
          <div class="dot" style="top: 25%; right: 25%"></div>
          <div
            class="dot"
            style="top: 50%; left: 25%; transform: translate(0, -50%)"
          ></div>
          <div
            class="dot"
            style="top: 50%; right: 25%; transform: translate(0, -50%)"
          ></div>
          <div class="dot" style="bottom: 25%; left: 25%"></div>
          <div class="dot" style="bottom: 25%; right: 25%"></div>
        </div>
      </div>

      <button id="rollDiceButton" class="btn btn-default roll">
        Roll Dice
      </button>
    </div>

    <script>
      $(document).ready(function () {
        // Track the total rotation of the die
        let currentRotation = 0;

        // Add click event listener to the roll button
        $("#rollDiceButton").on("click", function () {
          // Disable the button during animation to prevent spam clicking
          $(this).prop("disabled", true);

          // Add a visual feedback for button click
          $(this).css("transform", "scale(0.95)");
          setTimeout(() => {
            $(this).css("transform", "scale(1)");
          }, 150);

          rollDie();
        });

        function rollDie() {
          // Generate random number between 1 and 6
          let diceValue = Math.floor(Math.random() * 6) + 1;

          // Calculate rotation to ensure die ends up aligned (multiple of 180)
          // This prevents the die from stopping at odd angles
          let rotationToComplete = 180 - (currentRotation % 180);
          currentRotation += 180 + rotationToComplete;

          // Store the die element to avoid multiple jQuery selections
          const $die = $(".die");

          // Add data attribute for the current value
          $die.attr("data-value", diceValue);

          // Add animation effects
          $die.css({
            transition: "all 1s cubic-bezier(0.17, 0.67, 0.83, 0.67)", // Custom easing for more natural movement
            transform: `rotate(${currentRotation}deg) scale(1.1)`, // Add slight scale effect during rotation
            "box-shadow": "0 5px 15px rgba(0,0,0,0.2)", // Enhanced shadow during animation
          });

          // Reset scale and adjust shadow after animation
          setTimeout(() => {
            $die.css({
              transform: `rotate(${currentRotation}deg) scale(1)`,
              "box-shadow": "0 3px 10px rgba(0,0,0,0.1)",
            });

            // Re-enable the button
            $("#rollDiceButton").prop("disabled", false);
          }, 1000);

          // Remove existing dots with fade effect
          $(".dot").fadeOut(200, function () {
            $(this).remove();
            // Add new dots after old ones are removed
            addDots(diceValue, $die);
          });
        }

        // Separate function to handle adding dots
        function addDots(diceValue, $die) {
          // Configuration for dot positions
          const dotConfigs = {
            1: [
              {
                top: "50%",
                left: "50%",
                transform: "translate(-50%, -50%)",
              },
            ],
            2: [
              { top: "25%", left: "25%" },
              { bottom: "25%", right: "25%" },
            ],
            3: [
              { top: "25%", left: "25%" },
              { top: "50%", left: "50%", transform: "translate(-50%, -50%)" },
              { bottom: "25%", right: "25%" },
            ],
            4: [
              { top: "25%", left: "25%" },
              { top: "25%", right: "25%" },
              { bottom: "25%", left: "25%" },
              { bottom: "25%", right: "25%" },
            ],
            5: [
              { top: "25%", left: "25%" },
              { top: "25%", right: "25%" },
              { top: "50%", left: "50%", transform: "translate(-50%, -50%)" },
              { bottom: "25%", left: "25%" },
              { bottom: "25%", right: "25%" },
            ],
            6: [
              { top: "25%", left: "25%" },
              { top: "25%", right: "25%" },
              { top: "50%", left: "25%", transform: "translate(0, -50%)" },
              { top: "50%", right: "25%", transform: "translate(0, -50%)" },
              { bottom: "25%", left: "25%" },
              { bottom: "25%", right: "25%" },
            ],
          };

          // fade in dots based on the dice value
          dotConfigs[diceValue].forEach((config) => {
            $("<div>")
              .addClass("dot")
              .css({
                ...config,
                position: "absolute",
                opacity: 0,
              })
              .appendTo($die)
              .animate({ opacity: 1 }, 200);
          });
        }
      });
    </script>
  </body>
</html>
